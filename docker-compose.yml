version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000" # Optional: only needed if you want to access it locally on port 3000
    environment:
      - NODE_ENV=production
      # Pass through required secrets and API keys here
      # - TAVILY_API_KEY=${TAVILY_API_KEY}
      # - REVENUECAT_API_KEY=${REVENUECAT_API_KEY}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config: